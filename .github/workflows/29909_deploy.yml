# Druga skripta - build in push Docker zabojnika na DockerHub
# Sproži se samo ko se 29909_test uspešno zaključi
name: 29909_deploy

on:
  workflow_run:
    workflows: ["29909_test"]
    types:
      - completed

jobs:
  # ============================================================
  # JOB: Zapakira kodo v Docker zabojnik in ga potisne na DockerHub
  # Izvede se samo če je testna skripta uspešno zaključena
  # in če je napaka.txt prazen
  # ============================================================
  build-and-push:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Kloniramo repozitorij
        uses: actions/checkout@v4

      - name: Prenesemo artefakt napaka.txt
        uses: actions/download-artifact@v4
        with:
          name: napaka
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preverimo vsebino napaka.txt
        run: |
          # Če napaka.txt ni prazen, prekinemo deploy
          if [ -s napaka.txt ]; then
            echo "Testiranje ni uspelo, prekinjamo deploy"
            cat napaka.txt
            exit 1
          fi
          echo "napaka.txt je prazen, nadaljujemo z deployem"

      - name: Prijavimo se na DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Zgradimo Docker sliko
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/vaja2-radix:latest .

      - name: Potisnemo Docker sliko na DockerHub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/vaja2-radix:latest
